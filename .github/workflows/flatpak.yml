# Builds PenguinCAD as a Flatpak on the "stable" branch.
#
# Every run keeps the bundle as a workflow artifact. A pushed v* tag also
# publishes the release: the signed repository that pages.yml serves under
# /repo/, the bundle (which updates from that repository) and its checksum.
# packaging/repo/README.md describes the repository and its key.
name: Flatpak

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["website/**", "docs/**", "**/*.md"]
  pull_request:
    paths-ignore: ["website/**", "docs/**", "**/*.md"]
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_ID: io.github.kaiyao7572_creator.PenguinCAD
  BRANCH: stable
  REPO_URL: https://kaiyao7572-creator.github.io/PenguinCAD/repo/
  RUNTIME_REPO: https://dl.flathub.org/repo/flathub.flatpakrepo

jobs:
  flatpak:
    name: Build the Flatpak
    runs-on: ubuntu-latest
    container:
      # Flathub's image with flatpak-builder and the KDE 6.11 runtime.
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.11
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      # Only a release build ever holds the private key, and a release
      # without it must fail rather than ship an unsigned repository that
      # every client trusting packaging/repo/penguincad.gpg would refuse.
      - name: Import the repository signing key
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          SIGNING_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::The FLATPAK_GPG_PRIVATE_KEY secret is not set; a release cannot be signed."
            exit 1
          fi
          printf '%s\n' "$SIGNING_KEY" | gpg --batch --import
          fingerprint=$(gpg --batch --list-secret-keys --with-colons | awk -F: '/^fpr/ {print $10; exit}')
          expected=$(gpg --batch --show-keys --with-colons packaging/repo/penguincad.gpg | awk -F: '/^fpr/ {print $10; exit}')
          if [ -z "$fingerprint" ] || [ "$fingerprint" != "$expected" ]; then
            echo "::error::The secret's key (${fingerprint:-none}) is not packaging/repo/penguincad.gpg ($expected)."
            exit 1
          fi
          echo "GPG_KEY_ID=$fingerprint" >> "$GITHUB_ENV"

      - uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6.8
        with:
          manifest-path: packaging/io.github.kaiyao7572_creator.PenguinCAD.yml
          branch: ${{ env.BRANCH }}
          repo-dir: repo
          gpg-sign: ${{ env.GPG_KEY_ID }}
          # The bundle is made below, so it can name the repository it
          # updates from.
          build-bundle: false
          upload-artifact: false

      - name: Sign the repository and make the bundle
        run: |
          sign=""
          bundle_origin=""
          if [ -n "${GPG_KEY_ID:-}" ]; then
            sign="--gpg-sign=$GPG_KEY_ID"
            # A bundle installed by hand then updates from the repository.
            bundle_origin="--repo-url=$REPO_URL --gpg-keys=packaging/repo/penguincad.gpg"
            # The app catalogue (the appstream branches GNOME Software and
            # Discover search) is only recommitted when its contents change,
            # so one committed unsigned earlier would stay unsigned and every
            # client would refuse it. Dropping it makes this run sign a new one.
            rm -f repo/refs/heads/appstream/* repo/refs/heads/appstream2/*
          fi
          flatpak build-update-repo $sign --generate-static-deltas --prune \
              --title=PenguinCAD --default-branch="$BRANCH" repo
          flatpak build-bundle $sign $bundle_origin --runtime-repo="$RUNTIME_REPO" \
              repo PenguinCAD-x86_64.flatpak "$APP_ID" "$BRANCH"

      # What a user's machine does: trust only the published key, list the
      # app and fetch the catalogue. Any unsigned piece fails here, not for them.
      - name: Check the repository as a client would
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          flatpak remote-add --user --gpg-import=packaging/repo/penguincad.gpg release-check "file://$PWD/repo"
          flatpak remote-ls --user release-check | grep -F "$APP_ID"
          flatpak update --user --appstream release-check
          tar -C repo --exclude=./tmp --exclude=./.lock -czf flatpak-repo.tar.gz .

      - uses: actions/upload-artifact@v4
        with:
          name: PenguinCAD-x86_64.flatpak
          path: PenguinCAD-x86_64.flatpak

      - name: Checksum the bundle
        if: startsWith(github.ref, 'refs/tags/v')
        run: sha256sum PenguinCAD-x86_64.flatpak > PenguinCAD-x86_64.flatpak.sha256

      - name: Attach the bundle and the repository to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: PenguinCAD ${{ github.ref_name }}
          files: |
            PenguinCAD-x86_64.flatpak
            PenguinCAD-x86_64.flatpak.sha256
            flatpak-repo.tar.gz
          fail_on_unmatched_files: true
          # v0.2.0-rc1 and the like are test builds: they never become the
          # "latest" release the website's links point at.
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
