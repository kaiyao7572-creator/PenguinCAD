# Publishes the site to GitHub Pages:
#
#   /                         website/index.html, one self-contained page
#   /penguincad.flatpakref    adds the repository and installs PenguinCAD
#   /penguincad.flatpakrepo   adds the repository only
#   /install.sh               installs Flatpak if needed, Flathub and PenguinCAD
#   /og.png                   the link preview image (marketing/src/make.py)
#   /repo/                    the signed Flatpak repository of the latest release
#
# The page is built from website/src/ by website/build.py and committed; this
# job checks the committed copy is current. The repository comes from the
# latest release's flatpak-repo.tar.gz, so a release (flatpak.yml) triggers a
# fresh deploy and a website edit keeps the repository that is already out.
name: Website

on:
  push:
    branches: [main]
    paths: ["website/**", "packaging/repo/**", "packaging/install.sh", "marketing/og.png", ".github/workflows/pages.yml"]
  workflow_run:
    workflows: [Flatpak]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    # From a Flatpak run, only a successful release build: a tag push's run
    # has the tag as its head branch.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       startsWith(github.event.workflow_run.head_branch, 'v'))
    # On the job, not the workflow, so a run whose `if` skips it never joins
    # the group and cannot cancel a release deploy in progress. Every deploy
    # fetches the latest release, so queued runs lose nothing by waiting.
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Check website/index.html matches its source
        run: |
          python3 website/build.py
          if ! git diff --quiet -- website/index.html; then
            echo "::error::website/index.html is stale: run python3 website/build.py and commit the result"
            exit 1
          fi
      - name: Stage the page and the install files
        run: |
          mkdir _site
          cp website/index.html _site/index.html
          cp packaging/repo/penguincad.flatpakref packaging/repo/penguincad.flatpakrepo _site/
          cp packaging/install.sh _site/install.sh
          cp marketing/og.png _site/og.png
      # Pages replaces the whole site on every deploy, so a deploy without
      # the repository would cut off every installed copy's updates. Failing
      # instead leaves the previous deployment, repository and all, serving.
      - name: Unpack the latest release's Flatpak repository
        run: |
          url=https://github.com/${{ github.repository }}/releases/latest/download/flatpak-repo.tar.gz
          code=$(curl -sSL --retry 5 --retry-all-errors -w '%{http_code}' -o flatpak-repo.tar.gz "$url" || true)
          if [ "$code" != 200 ]; then
            echo "::error::Could not fetch $url (HTTP ${code:-none}); keeping the current deployment."
            exit 1
          fi
          mkdir _site/repo
          tar -xzf flatpak-repo.tar.gz -C _site/repo
          test -f _site/repo/summary.sig || { echo "::error::the published repository is not signed"; exit 1; }
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
