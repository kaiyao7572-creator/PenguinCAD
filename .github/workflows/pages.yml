# Publishes website/index.html -- one self-contained page -- to GitHub Pages.
# The page is built from website/src/ by website/build.py and committed; this
# job checks the committed copy is current, then deploys it as it is.
name: Website

on:
  push:
    branches: [main]
    paths: ["website/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check website/index.html matches its source
        run: |
          python3 website/build.py
          if ! git diff --quiet -- website/index.html; then
            echo "::error::website/index.html is stale: run python3 website/build.py and commit the result"
            exit 1
          fi
      - name: Stage the page
        run: mkdir _site && cp website/index.html _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
