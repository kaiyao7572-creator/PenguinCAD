    <path d="M22 58.6h19.5" stroke="#FF9F43" stroke-width="3.2" stroke-linecap="round"/>
  </symbol>
</defs><rect width="1080" height="1350" fill="#0b1119"/><rect width="1080" height="1350" fill="url(#minor)"/><rect width="1080" height="1350" fill="url(#major)"/><rect width="1080" height="1350" fill="url(#fade)"/>
<text x="80" y="150" font-size="24" style="font-family:'B612 Mono';letter-spacing:.14em" fill="#ff9f43" text-anchor="start" >NO CODE NEEDED</text>
<text x="80" y="250.0" font-size="84" style="font-family:Archivo;font-stretch:112%;font-weight:800;letter-spacing:-.01em" fill="#e7eef5" text-anchor="start" >You don't need</text><text x="80" y="342.4" font-size="84" style="font-family:Archivo;font-stretch:112%;font-weight:800;letter-spacing:-.01em" fill="#e7eef5" text-anchor="start" >to code to help.</text>
<rect x="80" y="490" width="920" height="124" rx="16" fill="#111a25" stroke="#223142" stroke-width="2"/>
<text x="116" y="546" font-size="34" style="font-family:Archivo;font-stretch:125%;font-weight:800" fill="#ff9f43" text-anchor="start" >1</text>
<text x="170" y="546" font-size="34" style="font-family:Archivo;font-weight:700" fill="#e7eef5" text-anchor="start" >Try it and tell me what breaks</text>
<text x="170" y="588" font-size="26" style="font-family:Archivo;font-weight:500" fill="#6f839a" text-anchor="start" >Every bug report makes it better.</text>
<rect x="80" y="640" width="920" height="124" rx="16" fill="#111a25" stroke="#223142" stroke-width="2"/>
<text x="116" y="696" font-size="34" style="font-family:Archivo;font-stretch:125%;font-weight:800" fill="#ff9f43" text-anchor="start" >2</text>
<text x="170" y="696" font-size="34" style="font-family:Archivo;font-weight:700" fill="#e7eef5" text-anchor="start" >Test it on your distro</text>
<text x="170" y="738" font-size="26" style="font-family:Archivo;font-weight:500" fill="#6f839a" text-anchor="start" >I can only check so many machines.</text>
<rect x="80" y="790" width="920" height="124" rx="16" fill="#111a25" stroke="#223142" stroke-width="2"/>
<text x="116" y="846" font-size="34" style="font-family:Archivo;font-stretch:125%;font-weight:800" fill="#ff9f43" text-anchor="start" >3</text>
<text x="170" y="846" font-size="34" style="font-family:Archivo;font-weight:700" fill="#e7eef5" text-anchor="start" >Draw icons, write a tutorial</text>
<text x="170" y="888" font-size="26" style="font-family:Archivo;font-weight:500" fill="#6f839a" text-anchor="start" >Design and docs count just as much.</text>
<rect x="80" y="940" width="920" height="124" rx="16" fill="#111a25" stroke="#223142" stroke-width="2"/>
<text x="116" y="996" font-size="34" style="font-family:Archivo;font-stretch:125%;font-weight:800" fill="#ff9f43" text-anchor="start" >4</text>
<text x="170" y="996" font-size="34" style="font-family:Archivo;font-weight:700" fill="#e7eef5" text-anchor="start" >Show it to a Fusion user on Linux</text>
<text x="170" y="1038" font-size="26" style="font-family:Archivo;font-weight:500" fill="#6f839a" text-anchor="start" >That's how it finds its people.</text>
<use href="#penguin" x="64" y="1258.28" width="52.9" height="52.9"/><text x="126.1" y="1296" font-size="28.52" style="font-family:Archivo;font-stretch:125%;font-weight:800" fill="#e7eef5">Penguin<tspan fill="#22a3e6">CAD</tspan></text><text x="1016" y="1290" font-size="22" style="font-family:'B612 Mono'" fill="#6f839a" text-anchor="end" >05 / 06</text><path d="M64 1234H1016" stroke="#223142" stroke-width="1.5"/></svg>