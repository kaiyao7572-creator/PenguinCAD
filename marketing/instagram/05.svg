<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><rect width="1080" height="1350" fill="#ffffff"/><text x="90" y="170" font-size="62" style="font-family:Archivo;font-stretch:100%;font-weight:700;letter-spacing:-.01em" fill="#111418" text-anchor="start">You don't need to code</text>
<text x="90" y="245" font-size="62" style="font-family:Archivo;font-stretch:100%;font-weight:700;letter-spacing:-.01em" fill="#111418" text-anchor="start">to help.</text>
<text x="90" y="400" font-size="44" style="font-family:Archivo;font-stretch:100%;font-weight:700;letter-spacing:-.01em" fill="#6b7280" text-anchor="start">1.</text>
<text x="154" y="400" font-size="44" style="font-family:Archivo;font-stretch:100%;font-weight:400" fill="#111418" text-anchor="start">Try it and tell me what breaks</text>
<text x="90" y="520" font-size="44" style="font-family:Archivo;font-stretch:100%;font-weight:700;letter-spacing:-.01em" fill="#6b7280" text-anchor="start">2.</text>
<text x="154" y="520" font-size="44" style="font-family:Archivo;font-stretch:100%;font-weight:400" fill="#111418" text-anchor="start">Test it on your Linux distro</text>
<text x="90" y="640" font-size="44" style="font-family:Archivo;font-stretch:100%;font-weight:700;letter-spacing:-.01em" fill="#6b7280" text-anchor="start">3.</text>
<text x="154" y="640" font-size="44" style="font-family:Archivo;font-stretch:100%;font-weight:400" fill="#111418" text-anchor="start">Make icons or write a tutorial</text>
<text x="90" y="760" font-size="44" style="font-family:Archivo;font-stretch:100%;font-weight:700;letter-spacing:-.01em" fill="#6b7280" text-anchor="start">4.</text>
<text x="154" y="760" font-size="44" style="font-family:Archivo;font-stretch:100%;font-weight:400" fill="#111418" text-anchor="start">Show it to a friend who uses Fusion</text>
<text x="90" y="1010.0" font-size="34" style="font-family:Archivo;font-stretch:100%;font-weight:400" fill="#6b7280" text-anchor="start">And if you want to chip in, there's a donate</text><text x="90" y="1054.2" font-size="34" style="font-family:Archivo;font-stretch:100%;font-weight:400" fill="#6b7280" text-anchor="start">button on the website. No pressure.</text>
<text x="90" y="1280" font-size="30" style="font-family:Archivo;font-stretch:100%;font-weight:700;letter-spacing:-.01em" fill="#111418" text-anchor="start">PenguinCAD</text><text x="990" y="1280" font-size="28" style="font-family:Archivo;font-stretch:100%;font-weight:400" fill="#6b7280" text-anchor="end">5 / 6</text></svg>